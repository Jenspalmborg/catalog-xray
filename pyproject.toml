[project]
name = "catalog-xray"
version = "0.1.0"
description = "Scrape a store, embed it with BehaviorGPT, and get a report on assortment gaps, missing keywords and search quality"
requires-python = ">=3.11"
dependencies = [
    "behaviorgpt @ git+https://github.com/Unbox-AI/behaviorgpt",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
xray = "xray.cli:main"
xray-web = "xray.cli:web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long lines are HTML templates and word lists.
"xray/report.py" = ["E501"]
"xray/nouns.py" = ["E501"]
"xray/analyze.py" = ["E501"]
